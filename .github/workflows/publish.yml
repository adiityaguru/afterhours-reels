name: publish-reels
on:
  # schedule trigger stays off until the dry run is approved:
  # schedule:
  #   - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only check files and token, do not post"
        default: "true"
permissions:
  contents: write
concurrency:
  group: publish
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Publish due reels
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          BASE_URL: https://adiityaguru.github.io/afterhours-reels
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run == 'true' && '1' || '0' }}
        run: node scripts/publish.mjs
      - name: Save state
        run: |
          git config user.name "reel-bot"
          git config user.email "reel-bot@users.noreply.github.com"
          git add state/published.json 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "state: published" && git push)
